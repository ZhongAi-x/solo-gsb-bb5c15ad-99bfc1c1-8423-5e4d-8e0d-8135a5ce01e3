services:
  director-api:
    build: .
    image: live-director-api:latest
    container_name: live-director-api
    ports:
      # 宿主机端口可用环境变量 PUBLISH_PORT 覆盖，默认 8000
      - "${PUBLISH_PORT:-8000}:8000"
    environment:
      # 对账任务超时（秒，自接纳起算、含排队时间），默认 10
      - RECONCILE_TIMEOUT_SECONDS=${RECONCILE_TIMEOUT_SECONDS:-10}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2))['status']=='ok' else 1)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
